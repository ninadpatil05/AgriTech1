<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="base.css" />
  <style>
    body.body-gradient {
      padding-top: 0;
    }

    .container {
      padding-top: 0.75rem;
    }

    .navbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.3rem 0;
      background: rgba(12, 20, 35, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #f8fafc;
      font-weight: 700;
      background: linear-gradient(135deg, #111827, #1f2937);
      border-radius: 999px;
      padding: 0.9rem 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
    }

    .brand span:first-child {
      font-size: 1.35rem;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
      justify-content: center;
    }

    .nav-link {
      color: rgba(242, 242, 247, 0.9);
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .nav-link.active {
      background: rgba(251, 191, 36, 0.95);
      color: #0f172a;
      font-weight: 700;
      box-shadow: 0 12px 24px rgba(251, 191, 36, 0.24);
    }

    .search-section {
      margin-top: 2rem;
      padding: 2rem;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
    }

    .search-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .search-header h1 {
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-header p {
      color: var(--muted);
      max-width: 700px;
      margin: 0 auto;
      font-size: 0.95rem;
    }

    .search-wrapper {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-input-group {
      display: flex;
      gap: 0.75rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
      padding: 0.85rem 1rem;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1);
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1rem;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .search-input::placeholder {
      color: #67778f;
    }

    .search-input:focus {
      color: var(--text);
    }

    .suggestions-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: none;
      border-radius: 0 0 18px 18px;
      max-height: 350px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      margin-top: 0.5rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    .suggestions-dropdown.show {
      display: block;
    }

    .suggestion-item {
      padding: 1rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .suggestion-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-icon {
      font-size: 1.2rem;
    }

    .suggestion-name {
      font-weight: 500;
      color: var(--text);
    }

    .suggestion-type {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .disease-container {
      margin-top: 2rem;
    }

    .disease-card {
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .disease-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .disease-icon {
      font-size: 3rem;
      min-width: 80px;
      text-align: center;
      background: rgba(96, 165, 250, 0.1);
      border-radius: 16px;
      padding: 1rem;

      font-size: 1.8rem;
      color: #f8fafc;
    }

    .disease-title-group p {
      margin: 0.5rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .disease-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .info-block {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);

      padding: 1.5rem;

    .info-block.symptoms {

    }

    .info-block.treatment {

    }

    .info-block.prevention {

    }

    .info-block.soil {
      border-left-color: #8b5cf6;
    }

    .info-block h3 {

      font-size: 1.1rem;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;

    .info-block ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .info-block li {
      padding: 0.5rem 0;
      color: var(--muted);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .info-block li:last-child {

    }

    .info-block li:before {

      color: var(--success);
      font-weight: 700;
      margin-right: 0.5rem;
    }

    .disease-details {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.5rem;
      margin-top: 1.5rem;

    .disease-details h3 {
      margin-top: 0;
      font-size: 1.1rem;
      color: #f8fafc;
      margin-bottom: 1rem;
    }

    .disease-details p {
      color: var(--muted);
      line-height: 1.8;
      margin: 0 0 1rem;
      text-align: justify;
    }

    .disease-details p:last-child {
      margin-bottom: 0;
    }

    .severity-badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;

      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
      color: #fbbf24;

    .severity-badge.low {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.3);

    .no-results {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .no-results p {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .no-results span {
      font-size: 3rem;
      display: block;

    }

    footer {
      margin-top: 3rem;
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid rgba(255, 255, 255, 0.08);

      .navbar {
        flex-direction: column;
        align-items: stretch;
      }
      .menu {

      }
      .disease-header {
        flex-direction: column;
        text-align: center;
      }
      .disease-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    const searchInput = document.getElementById('searchInput');
    const suggestionsDropdown = document.getElementById('suggestionsDropdown');
    const diseaseContainer = document.getElementById('diseaseContainer');

    function debounce(fn, ms) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    function handleSearch(e) {
      const query = e.target.value.toLowerCase().trim();
      
      if (query.length === 0) {
        suggestionsDropdown.classList.remove('show');
        displayAllDiseases();
        return;
      }

      const filtered = diseaseDatabase.filter(disease =>
        disease.name.toLowerCase().includes(query) ||
        disease.searchTerms.some(term => term.includes(query))
      );

      if (filtered.length > 0) {
        showSuggestions(filtered, query);
        displayDiseases(filtered);
      } else {
        suggestionsDropdown.classList.remove('show');
        diseaseContainer.innerHTML = `
          <div class="no-results">
            <span>🔍</span>
            <p>No diseases found matching "${query}"</p>
            <p style="font-size: 0.9rem; margin-top: 1rem;">Try searching for: leaf spot, rust, mildew, blight, or wilt</p>
          </div>
        `;
      }
    }

    // Handle search input
    searchInput.addEventListener('input', debounce(handleSearch, 300));

    // Close dropdown on click outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        suggestionsDropdown.classList.remove('show');
      }
    });

    function showSuggestions(diseases, query) {
      suggestionsDropdown.innerHTML = diseases.map(disease => `
        <div class="suggestion-item" onclick="selectDisease('${disease.name}')">
          <span class="suggestion-icon">${disease.icon}</span>
          <div>
            <div class="suggestion-name">${disease.name}</div>
            <div class="suggestion-type">${disease.scientificName}</div>
          </div>
        </div>
      `).join('');
      suggestionsDropdown.classList.add('show');
    }

    function selectDisease(diseaseName) {
      searchInput.value = diseaseName;
      suggestionsDropdown.classList.remove('show');
      const disease = diseaseDatabase.find(d => d.name === diseaseName);
      if (disease) {
        displayDiseases([disease]);
        disease.element?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function displayDiseases(diseases) {
      diseaseContainer.innerHTML = diseases.map(disease => `
        <div class="disease-card">
          <div class="disease-header">
            <div class="disease-icon">${disease.icon}</div>
            <div class="disease-title-group">
              <h2>${disease.name}</h2>
              <p><strong>Scientific Name:</strong> ${disease.scientificName}</p>
            </div>
            <div class="severity-badge ${disease.severity === 'high' ? '' : disease.severity === 'medium' ? 'medium' : 'low'}">
              Severity: ${disease.severity.charAt(0).toUpperCase() + disease.severity.slice(1)}
            </div>
          </div>

          <div class="disease-details">
            <h3>📋 About This Disease</h3>
            <p>${disease.description}</p>
          </div>

          <div class="disease-grid">
            <div class="info-block symptoms">
              <h3>🔍 Symptoms</h3>
              <ul>
                ${disease.symptoms.map(symptom => `<li>${symptom}</li>`).join('')}
              </ul>
            </div>

            <div class="info-block treatment">
              <h3>💊 Treatment</h3>
              <ul>
                ${disease.treatment.map(treatment => `<li>${treatment}</li>`).join('')}
              </ul>
            </div>

            <div class="info-block prevention">
              <h3>🛡️ Prevention</h3>
              <ul>
                ${disease.prevention.map(prevention => `<li>${prevention}</li>`).join('')}
              </ul>
            </div>

            <div class="info-block soil">
              <h3>🌍 Soil Requirements</h3>
              <ul>
                ${disease.soil.map(soil => `<li>${soil}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>
      `).join('');
    }

    function displayAllDiseases() {
      diseaseContainer.innerHTML = `
        <div style="text-align: center; padding: 2rem; color: var(--muted);">
          <p>📚 Browse our library or search for specific diseases</p>
          <p style="font-size: 0.9rem;">Total diseases in database: ${diseaseDatabase.length}</p>
        </div>
      `;
    }

    // Display all diseases on page load
    displayAllDiseases();
  </script>
</body>
</html>
